
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Sort Challenge</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg,#10172f,#202b50);
  color: white;
  text-align: center;
  padding: 20px 10px;
}

h1 { color: #65e6ff; margin: 12px 0; }

.info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
  font-size: 17px;
}

#message {
  color: #ffe58a;
  min-height: 25px;
  margin: 12px;
}

#game {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 22px;
  max-width: 550px;
  margin: 35px auto;
}

.bottle {
  width: 53px;
  height: 174px;
  border: 3px solid #b8eaff;
  border-top: 0;
  border-radius: 0 0 17px 17px;
  background: rgba(255,255,255,.08);
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  cursor: pointer;
  transition: .2s;
  position: relative;
}

.bottle.selected {
  transform: translateY(-15px);
  border-color: #ffdf66;
  box-shadow: 0 0 14px #ffdf66;
}

.layer {
  width: 100%;
  height: 25%;
  border-top: 1px solid rgba(255,255,255,.35);
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  margin: 7px;
  background: #36c9e9;
  color: #10172f;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:active { transform: scale(.95); }

#levels {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 400px;
  margin: 20px auto;
}

.level {
  width: 38px;
  height: 38px;
  padding: 0;
  margin: 0;
  background: #38476c;
  color: white;
}

.level.unlocked { background: #16a783; }
.level.current { background: #ffbc42; }

#win {
  display: none;
  background: #24375d;
  border-radius: 18px;
  padding: 20px;
  max-width: 350px;
  margin: 20px auto;
}

small { color: #b7c9e9; }
</style>
</head>

<body>

<h1>💧 WATER SORT</h1>
<p>Complete All 15 Challenges!</p>

<div class="info">
  <span>Level: <b id="level">1</b>/15</span>
  <span>Moves: <b id="moves">0</b></span>
</div>

<p id="difficulty">Difficulty: EASY</p>
<p id="message">Select a bottle to start!</p>

<div id="game"></div>

<div>
  <button onclick="undo()">↩ Undo</button>
  <button onclick="restart()">🔄 Restart</button>
</div>

<h3>LEVEL SELECT</h3>
<div id="levels"></div>

<div id="win">
  <h2 id="winTitle">🎉 LEVEL COMPLETE!</h2>
  <p id="winText">Excellent work!</p>
  <button id="nextBtn" onclick="nextLevel()">Next Level ➜</button>
</div>

<script>
const colors = [
 "#ff4d6d", "#42a5f5", "#ffca28",
 "#66bb6a", "#ab47bc", "#ff8a50",
 "#26c6da", "#ec407a", "#9ccc65"
];

const levelSettings = [
 [2,5], [2,8], [3,10],
 [4,15], [4,19], [5,22],
 [5,27], [5,32], [6,36],
 [6,42], [7,48], [7,55],
 [8,62], [8,70], [9,80]
];

// Each level has its own randomized starting puzzle.
let puzzles = [];
let currentLevel = 1;
let tubes = [];
let initial = [];
let selected = null;
let history = [];
let moves = 0;
let unlocked = Number(localStorage.getItem("waterUnlocked") || 1);

function createPuzzles() {
  puzzles = levelSettings.map(([count, mix]) => {
    let balls = [];

    for (let c = 0; c < count; c++) {
      for (let j = 0; j < 4; j++) balls.push(c);
    }

    // Shuffle the colored layers.
    for (let i = balls.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [balls[i], balls[j]] = [balls[j], balls[i]];
    }

    let result = [];
    for (let i = 0; i < count; i++) {
      result.push(balls.slice(i * 4, i * 4 + 4));
    }

    result.push([], []);

    // Additional random mixing swaps increase variety.
    for (let i = 0; i < mix; i++) {
      let a = Math.floor(Math.random() * count);
      let b = Math.floor(Math.random() * count);
      if (a !== b) {
        let x = Math.floor(Math.random() * 4);
        let y = Math.floor(Math.random() * 4);
        [result[a][x], result[b][y]] =
        [result[b][y], result[a][x]];
      }
    }

    return result;
  });
}

function difficulty() {
  if (currentLevel <= 3) return "EASY 🟢";
  if (currentLevel <= 10) return "MODERATE 🟡";
  return "SUPER DIFFICULT 🔴";
}

function startLevel(n) {
  if (n > unlocked || n > 15) return;

  currentLevel = n;
  initial = JSON.parse(JSON.stringify(puzzles[n - 1]));
  tubes = JSON.parse(JSON.stringify(initial));
  history = [];
  moves = 0;
  selected = null;

  document.getElementById("win").style.display = "none";
  document.getElementById("level").textContent = n;
  document.getElementById("difficulty").textContent =
    "Difficulty: " + difficulty();

  document.getElementById("message").textContent =
    "Sort all colors into separate bottles!";

  render();
  renderLevels();
}

function render() {
  const game = document.getElementById("game");
  game.innerHTML = "";

  tubes.forEach((tube, i) => {
    const bottle = document.createElement("div");
    bottle.className = "bottle" +
      (selected === i ? " selected" : "");

    tube.forEach(color => {
      const layer = document.createElement("div");
      layer.className = "layer";
      layer.style.background = colors[color];
      bottle.appendChild(layer);
    });

    bottle.onclick = () => tapBottle(i);
    game.appendChild(bottle);
  });

  document.getElementById("moves").textContent = moves;
}

function tapBottle(i) {
  if (document.getElementById("win").style.display === "block")
    return;

  if (selected === null) {
    if (tubes[i].length === 0) return;
    selected = i;
    render();
    return;
  }

  if (selected === i) {
    selected = null;
    render();
    return;
  }

  let source = tubes[selected];
  let target = tubes[i];

  if (
    source.length > 0 &&
    target.length < 4 &&
    (target.length === 0 ||
     target[target.length - 1] === source[source.length - 1])
  ) {
    history.push(JSON.stringify(tubes));

    const color = source[source.length - 1];
    let amount = 0;

    while (
      source.length > 0 &&
      source[source.length - 1] === color &&
      target.length < 4
    ) {
      target.push(source.pop());
      amount++;
    }

    moves++;
    document.getElementById("message").textContent =
      "Great move! +" + amount + " layer(s)";
    selected = null;
    render();

    if (isWon()) setTimeout(showWin, 250);
  } else {
    selected = i;
    render();

    if (tubes[i].length === 0) return;
    document.getElementById("message").textContent =
      "You can only match the same colors!";
  }
}

function isWon() {
  return tubes.every(tube =>
    tube.length === 0 ||
    (tube.length === 4 &&
     tube.every(color => color === tube[0]))
  );
}

function showWin() {
  document.getElementById("win").style.display = "block";

  if (currentLevel < 15) {
    document.getElementById("winTitle").textContent =
      "🎉 LEVEL COMPLETE!";
    document.getElementById("winText").textContent =
      "You completed level " + currentLevel + "!";

    unlocked = Math.max(unlocked, currentLevel + 1);
    localStorage.setItem("waterUnlocked", unlocked);
    document.getElementById("nextBtn").style.display = "inline-block";
  } else {
    document.getElementById("winTitle").textContent =
      "🏆 YOU ARE THE CHAMPION!";
    document.getElementById("winText").textContent =
      "All 15 levels completed. Congratulations!";
    document.getElementById("nextBtn").style.display = "none";
  }

  renderLevels();
}

function nextLevel() {
  if (currentLevel < 15) startLevel(currentLevel + 1);
}

function undo() {
  if (history.length === 0) return;

  tubes = JSON.parse(history.pop());
  moves = Math.max(0, moves - 1);
  selected = null;
  render();
}

function restart() {
  tubes = JSON.parse(JSON.stringify(initial));
  history = [];
  moves = 0;
  selected = null;
  document.getElementById("win").style.display = "none";
  document.getElementById("message").textContent =
    "Level restarted. Try again!";
  render();
}

function renderLevels() {
  const box = document.getElementById("levels");
  box.innerHTML = "";

  for (let i = 1; i <= 15; i++) {
    const btn = document.createElement("button");
    btn.className = "level";

    if (i <= unlocked) btn.classList.add("unlocked");
    if (i === currentLevel) btn.classList.add("current");

    btn.textContent = i;
    btn.disabled = i > unlocked;
    btn.onclick = () => startLevel(i);

    box.appendChild(btn);
  }
}

createPuzzles();
startLevel(1);
</script>

</body>
</html>
